services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kamary/laravel-app
    container_name: kamary-app
    restart: unless-stopped
    tty: true
    environment:
      - APP_NAME=${APP_NAME}
      - APP_ENV=${APP_ENV}
      - APP_KEY=${APP_KEY}
      - APP_DEBUG=${APP_DEBUG}
      - APP_PROTOCOL=${APP_PROTOCOL}
      - APP_CORRELATIVE=${APP_CORRELATIVE}
      - APP_DOMAIN=${APP_DOMAIN}
      - APP_URL=${APP_URL}
      - WA_URL=${WA_URL}
      - EVOAPI_URL=${EVOAPI_URL}
      - EVOAPI_INSTANCE=${EVOAPI_INSTANCE}
      - EVOAPI_APIKEY=${EVOAPI_APIKEY}
      - REPOSITORY_URL=${REPOSITORY_URL}
      - WAGROUP_VENTAS_ID=${WAGROUP_VENTAS_ID}
      - LOG_CHANNEL=${LOG_CHANNEL}
      - LOG_DEPRECATIONS_CHANNEL=${LOG_DEPRECATIONS_CHANNEL}
      - LOG_LEVEL=${LOG_LEVEL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-kamary_db}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      - BROADCAST_DRIVER=${BROADCAST_DRIVER}
      - CACHE_DRIVER=${CACHE_DRIVER}
      - FILESYSTEM_DISK=${FILESYSTEM_DISK}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION}
      - SESSION_COOKIE=${SESSION_COOKIE}
      - SESSION_DOMAIN=${SESSION_DOMAIN}
      - SESSION_DRIVER=${SESSION_DRIVER}
      - SESSION_LIFETIME=${SESSION_LIFETIME}
      - MEMCACHED_HOST=${MEMCACHED_HOST}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_PORT=${REDIS_PORT}
      - MAIL_MAILER=${MAIL_MAILER}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - CULQI_API=${CULQI_API}
      - CULQI_PRIVATE_KEY=${CULQI_PRIVATE_KEY}
      - CULQI_PUBLIC_KEY=${CULQI_PUBLIC_KEY}
      - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - TINYMCE_KEY=${TINYMCE_KEY}
      - FACTURADORPRO5_MODE=${FACTURADORPRO5_MODE:-api}
      - FACTURADORPRO5_BASE_URL=${FACTURADORPRO5_BASE_URL:-http://facturador-nginx}
      - FACTURADORPRO5_TOKEN=${FACTURADORPRO5_TOKEN:-}
      - FACTURADORPRO5_AUTH_MODE=${FACTURADORPRO5_AUTH_MODE:-login}
      - FACTURADORPRO5_API_EMAIL=${FACTURADORPRO5_API_EMAIL:-admin@gmail.com}
      - FACTURADORPRO5_API_PASSWORD=${FACTURADORPRO5_API_PASSWORD:-123456}
      - FACTURADORPRO5_TIMEOUT=${FACTURADORPRO5_TIMEOUT:-30}
      - FACTURADORPRO5_VERIFY_SSL=${FACTURADORPRO5_VERIFY_SSL:-false}
      - FACTURADORPRO5_AUTH_LOGIN_ENDPOINT=${FACTURADORPRO5_AUTH_LOGIN_ENDPOINT:-/api/auth/login}
      - FACTURADORPRO5_ISSUE_ENDPOINT=${FACTURADORPRO5_ISSUE_ENDPOINT:-/api/documents}
      - FACTURADORPRO5_STATUS_ENDPOINT=${FACTURADORPRO5_STATUS_ENDPOINT:-/api/documents/status}
      - FACTURADORPRO5_CANCEL_ENDPOINT=${FACTURADORPRO5_CANCEL_ENDPOINT:-/api/voided}
      - FACTURADORPRO5_CANCEL_STATUS_ENDPOINT=${FACTURADORPRO5_CANCEL_STATUS_ENDPOINT:-/api/voided/status}
      - FACTURADORPRO5_CREDIT_NOTE_ENDPOINT=${FACTURADORPRO5_CREDIT_NOTE_ENDPOINT:-/api/documents}
      - FACTURADORPRO5_COMPANY_ENDPOINT=${FACTURADORPRO5_COMPANY_ENDPOINT:-/api/company}
      - FACTURADORPRO5_DEMO_TEMPLATE_PATH=${FACTURADORPRO5_DEMO_TEMPLATE_PATH:-demo/facturadorpro5}
      - FACTURADORPRO5_SERIES_FACTURA=${FACTURADORPRO5_SERIES_FACTURA:-F001}
      - FACTURADORPRO5_SERIES_BOLETA=${FACTURADORPRO5_SERIES_BOLETA:-B001}
      - FACTURADORPRO5_SERIES_NOTA_CREDITO=${FACTURADORPRO5_SERIES_NOTA_CREDITO:-FC01}
    depends_on:
      - db
    volumes:
      - storage:/var/www/html/storage
      - cache:/var/www/html/bootstrap/cache
      - ./docker-compose/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - app-network-kamary
      - billing-network

  db:
    image: mysql:8.0
    container_name: kamary-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kamary_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network-kamary

  nginx:
    image: nginx:latest
    container_name: kamary-nginx
    restart: unless-stopped
    ports:
      - "8060:80" # Mapea el puerto 80 del contenedor al puerto 8080 del host
    volumes:
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
      - storage:/var/www/html/storage
      # - ./romulio.factusode.xyz:/etc/letsencrypt/live/romulio.factusode.xyz  # Monta los certificados SSL
    networks:
      - app-network-kamary

  facturador-app:
    build:
      context: ./facturador
    container_name: facturador-app
    restart: unless-stopped
    depends_on:
      - facturador-db
    env_file:
      - ./facturador/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL_BASE: facturador-nginx
      APP_URL: http://facturador-nginx
      APP_TIMEZONE: America/Lima
      TZ: America/Lima
      FORCE_HTTPS: "false"
      DB_CONNECTION: mysql
      DB_HOST: facturador-db
      DB_PORT: 3306
      DB_DATABASE: ${FACTURADOR_DB_DATABASE:-facturador}
      DB_USERNAME: ${FACTURADOR_DB_USERNAME:-facturador}
      DB_PASSWORD: ${FACTURADOR_DB_PASSWORD:-facturador}
      AUTO_RUN_COMPOSER_INSTALL: "false"
      AUTO_RUN_STORAGE_LINK: "true"
      AUTO_RUN_MIGRATIONS: "false"
      AUTO_RUN_DB_CLEANUP: "false"
      AUTO_RUN_SEEDERS: "false"
      AUTO_RUN_OPTIMIZE: "true"
      AUTO_RUN_OPTIMIZE_CLEAR: "true"
      AUTO_RUN_SMOKE_TESTS: "false"
      AUTO_RUN_E2E_DOCUMENT_SMOKE: "false"
      AUTO_RUN_CONFIG_CACHE: "false"
      AUTO_RUN_ROUTE_CACHE: "false"
      AUTO_RUN_VIEW_CACHE: "false"
      DB_WAIT_MAX_TRIES: 90
      DB_WAIT_SECONDS: 2
      MIGRATION_MAX_TRIES: 8
    volumes:
      - ./facturador/docker-data/storage/public_uploads:/var/www/html/storage/app/public/uploads
      - ./facturador/docker-data/storage/tenancy:/var/www/html/storage/app/tenancy
      - ./facturador/docker-data/storage/sessions:/var/www/html/storage/framework/sessions
    expose:
      - "9000"
    networks:
      - facturador-network

  facturador-nginx:
    image: nginx:1.27-alpine
    container_name: facturador-nginx
    restart: unless-stopped
    depends_on:
      - facturador-app
    expose:
      - "80"
    volumes:
      - ./facturador/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./facturador:/var/www/html
      - ./facturador/docker-data/storage/public_uploads:/var/www/html/storage/app/public/uploads:ro
    networks:
      - facturador-network
      - billing-network

  facturador-db:
    image: mysql:8.0
    container_name: facturador-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${FACTURADOR_DB_DATABASE:-facturador}
      MYSQL_USER: ${FACTURADOR_DB_USERNAME:-facturador}
      MYSQL_PASSWORD: ${FACTURADOR_DB_PASSWORD:-facturador}
      MYSQL_ROOT_PASSWORD: ${FACTURADOR_DB_ROOT_PASSWORD:-facturador_root}
      TZ: America/Lima
    volumes:
      - facturador-dbdata:/var/lib/mysql
    networks:
      - facturador-network

networks:
  app-network-kamary:
    driver: bridge
  facturador-network:
    driver: bridge
  billing-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
  facturador-dbdata:
    driver: local
  storage:
    driver: local
  cache:
    driver: local

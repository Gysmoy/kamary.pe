; Mitigacion de CVE-2026-109618 / CVE-2026-109619 (PHP, RCE). Reduce la superficie, no arregla:
; el arreglo es el PHP parcheado que compila el Dockerfile (etapa php-cve-build).
; Carga despues de 99-runtime.ini (orden alfabetico en conf.d).
; Los limites de subida quedan en los valores que ya regian (defaults de PHP): no se amplian.
session.upload_progress.enabled = 0
post_max_size = 8M
upload_max_filesize = 2M

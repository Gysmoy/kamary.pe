services:
  app:
    build: .
    container_name: factu_lite_app
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL_BASE: f2.devex.pe
      APP_URL: https://f2.devex.pe
      APP_TIMEZONE: America/Lima
      TZ: America/Lima
      FORCE_HTTPS: "true"

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      AUTO_RUN_COMPOSER_INSTALL: "false"
      AUTO_RUN_STORAGE_LINK: "true"
      AUTO_RUN_MIGRATIONS: "false"
      AUTO_RUN_DB_CLEANUP: "false"
      AUTO_RUN_SEEDERS: "false"
      AUTO_RUN_OPTIMIZE: "true"
      AUTO_RUN_OPTIMIZE_CLEAR: "true"
      AUTO_RUN_SMOKE_TESTS: "false"
      AUTO_RUN_E2E_DOCUMENT_SMOKE: "false"
      AUTO_RUN_CONFIG_CACHE: "false"
      AUTO_RUN_ROUTE_CACHE: "false"
      AUTO_RUN_VIEW_CACHE: "false"
      DB_WAIT_MAX_TRIES: 90
      DB_WAIT_SECONDS: 2
      MIGRATION_MAX_TRIES: 8

    volumes:
      - ./docker-data/storage/public_uploads:/var/www/html/storage/app/public/uploads
      - ./docker-data/storage/tenancy:/var/www/html/storage/app/tenancy
      - ./docker-data/storage/sessions:/var/www/html/storage/framework/sessions

    expose:
      - "9000"

    networks:
      app-network-f2:
        aliases:
          - facturador-app

  nginx:
    image: nginx:1.27-alpine
    container_name: factu_lite_nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "9040:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - .:/var/www/html
      - ./docker-data/storage/public_uploads:/var/www/html/storage/app/public/uploads:ro
    networks:
      - app-network-f2
    
  db:
    image: mysql:8.0
    container_name: f2-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: America/Lima
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - app-network-f2

networks:
  app-network-f2:
    driver: bridge

volumes:
  dbdata:
    driver: local

name: Seed Production Module Data

on:
  push:
    branches:
      - main
    paths:
      - database/seeders/ProductionModuleDataSeeder.php
      - .github/workflows/seed-production-data.yaml
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH key
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Run production seeders on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes $SSH_USER@$SSH_HOST << EOF
            set -Ee

            cd /var/docker/kamary
            git pull

            docker compose exec -T app sh -lc 'if [ ! -f storage/app/.production-module-data-seeded-v1 ]; then php artisan migrate --force && php artisan db:seed --class=ProductionModuleDataSeeder --force && php artisan kamary:audit-operational-scope --fix && php artisan kamary:audit-operational-scope && php artisan optimize:clear && mkdir -p storage/app && date -Is > storage/app/.production-module-data-seeded-v1; else echo "Production module data already seeded"; fi'
          EOF

name: Deploy Kamary to Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Execute Docker Commands on Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          REPOSITORY_B64=$(printf '%s' "$REPOSITORY" | base64 -w 0)
          BRANCH_B64=$(printf '%s' "$BRANCH" | base64 -w 0)
          COMMIT_B64=$(printf '%s' "$COMMIT" | base64 -w 0)
          COMMIT_MSG_B64=$(printf '%s' "$COMMIT_MSG" | base64 -w 0)
          AUTHOR_NAME_B64=$(printf '%s' "$AUTHOR_NAME" | base64 -w 0)
          AUTHOR_EMAIL_B64=$(printf '%s' "$AUTHOR_EMAIL" | base64 -w 0)

          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" \
            "REPOSITORY_B64=$REPOSITORY_B64 BRANCH_B64=$BRANCH_B64 COMMIT_B64=$COMMIT_B64 COMMIT_MSG_B64=$COMMIT_MSG_B64 AUTHOR_NAME_B64=$AUTHOR_NAME_B64 AUTHOR_EMAIL_B64=$AUTHOR_EMAIL_B64 bash -se" << 'EOF'
            b64decode() {
              printf '%s' "$1" | base64 -d
            }

            json_escape() {
              printf '%s' "$1" | sed 's/\\/\\\\/g; s/"/\\"/g' | tr '\n' ' '
            }

            REPOSITORY="$(b64decode "$REPOSITORY_B64")"
            BRANCH="$(b64decode "$BRANCH_B64")"
            COMMIT="$(b64decode "$COMMIT_B64")"
            COMMIT_MSG="$(b64decode "$COMMIT_MSG_B64")"
            AUTHOR_NAME="$(b64decode "$AUTHOR_NAME_B64")"
            AUTHOR_EMAIL="$(b64decode "$AUTHOR_EMAIL_B64")"

            set -Ee

            notify_deployment() {
              DEPLOY_STATUS="$1"
              DEPLOY_ERROR="${2:-}"
              DEPLOY_EXIT_CODE="${3:-0}"
              TIMESTAMP="$(date -Is)"

              PAYLOAD="{\"service\":\"Kamary\",\"repository\":\"$(json_escape "$REPOSITORY")\",\"branch\":\"$(json_escape "$BRANCH")\",\"commit\":\"$(json_escape "$COMMIT")\",\"message\":\"$(json_escape "$COMMIT_MSG")\",\"author_name\":\"$(json_escape "$AUTHOR_NAME")\",\"author_email\":\"$(json_escape "$AUTHOR_EMAIL")\",\"env\":\"production\",\"status\":\"$(json_escape "$DEPLOY_STATUS")\""
              if [ "$DEPLOY_STATUS" = "failed" ]; then
                PAYLOAD="$PAYLOAD,\"error\":\"$(json_escape "$DEPLOY_ERROR")\",\"exit_code\":\"$(json_escape "$DEPLOY_EXIT_CODE")\""
              fi
              PAYLOAD="$PAYLOAD,\"timestamp\":\"$(json_escape "$TIMESTAMP")\"}"

              curl -fsS -X POST https://devex.pe/free/deployments \
                -H "Content-Type: application/json" \
                -d "$PAYLOAD"
            }

            on_error() {
              EXIT_CODE=$?
              FAILED_COMMAND="${BASH_COMMAND:-unknown}"
              set +e
              notify_deployment "failed" "$FAILED_COMMAND" "$EXIT_CODE"
              NOTIFY_EXIT=$?
              if [ "$NOTIFY_EXIT" -ne 0 ]; then
                echo "Deployment notification failed with exit code $NOTIFY_EXIT" >&2
              fi
              exit "$EXIT_CODE"
            }

            trap on_error ERR

            cd /var/docker/kamary

            if [ -f facturador/.env ] && ! git ls-files --error-unmatch facturador/.env >/dev/null 2>&1; then
              rm facturador/.env
            fi

            git pull

            if [ ! -f facturador/.env ] && [ -f facturador/.env.example ]; then
              cp facturador/.env.example facturador/.env
            fi

            docker builder prune -f
            docker network prune -f
            docker image prune -f
            docker compose up -d --build

            docker compose exec -T app sh -lc 'i=1; while [ "$i" -le 30 ]; do php artisan migrate --force && exit 0; i=$((i + 1)); sleep 2; done; exit 1'
            docker compose exec -T app sh -lc 'if [ ! -f storage/app/.production-module-seeders-v2-ran ]; then php artisan db:seed --class=ProductionModuleDataSeeder --force; php artisan kamary:audit-operational-scope --fix; php artisan kamary:audit-operational-scope; mkdir -p storage/app; date -Is > storage/app/.production-module-seeders-v2-ran; else echo "Production module seeders v2 already ran"; fi'
            docker compose exec -T app php artisan optimize:clear
            
            notify_deployment "success"
          EOF

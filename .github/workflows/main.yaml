name: Deploy Kamary to Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Execute Docker Commands on Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          REMOTE_ENV=$(printf 'REPOSITORY=%q BRANCH=%q COMMIT=%q COMMIT_MSG=%q AUTHOR_NAME=%q AUTHOR_EMAIL=%q' \
            "$REPOSITORY" "$BRANCH" "$COMMIT" "$COMMIT_MSG" "$AUTHOR_NAME" "$AUTHOR_EMAIL")

          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_USER@$SSH_HOST" "$REMOTE_ENV bash -se" << 'EOF'
            set -Ee

            notify_deploy() {
              STATUS="$1"
              ERROR_MESSAGE="${2:-}"
              EXIT_CODE_VALUE="${3:-}"

              python3 - "$STATUS" "$ERROR_MESSAGE" "$EXIT_CODE_VALUE" << 'PY' | curl -sS -X POST https://devex.pe/free/deployments \
                -H "Content-Type: application/json" \
                -d @- || true
          import datetime
          import json
          import os
          import sys

          status = sys.argv[1]
          error_message = sys.argv[2]
          exit_code = sys.argv[3]

          payload = {
              "service": "Kamary",
              "repository": os.environ.get("REPOSITORY", ""),
              "branch": os.environ.get("BRANCH", ""),
              "commit": os.environ.get("COMMIT", ""),
              "message": os.environ.get("COMMIT_MSG", ""),
              "author_name": os.environ.get("AUTHOR_NAME", ""),
              "author_email": os.environ.get("AUTHOR_EMAIL", ""),
              "env": "production",
              "status": status,
              "timestamp": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }

          if status == "failed":
              payload["error"] = error_message
              payload["exit_code"] = exit_code

          print(json.dumps(payload))
          PY
            }

            on_error() {
              EXIT_CODE=$?
              FAILED_COMMAND="$BASH_COMMAND"

              trap - ERR
              notify_deploy "failed" "$FAILED_COMMAND" "$EXIT_CODE"
              exit "$EXIT_CODE"
            }

            trap on_error ERR

            cd /var/docker/kamary

            if [ -f facturador/.env ] && ! git ls-files --error-unmatch facturador/.env >/dev/null 2>&1; then
              rm facturador/.env
            fi

            git pull

            if [ ! -f facturador/.env ] && [ -f facturador/.env.example ]; then
              cp facturador/.env.example facturador/.env
            fi

            docker builder prune -f
            docker network prune -f
            docker image prune -f
            docker compose up -d --build
            docker compose exec --interactive=false -T app php artisan migrate --force
            docker compose exec --interactive=false -T app php artisan optimize:clear

            notify_deploy "success"
            echo "Deploy success notification sent."
          EOF

name: Deploy Kamary to Contabo

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Execute Docker Commands on Server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no "$SSH_USER@$SSH_HOST" 'bash -se' <<'EOF'
            set -Eeuo pipefail
            cd /var/docker/kamary

            if [ ! -f facturador/.env ] && [ -f facturador/.env.example ]; then
              cp facturador/.env.example facturador/.env
            fi

            git pull

            docker builder prune -f
            docker network prune -f
            docker image prune -f
            docker compose up -d --build
          EOF

      - name: Notify deployment success
        if: success()
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
        run: |
          PAYLOAD="$(python3 - <<'PY'
import json
import os

payload = {
    "service": "Kamary",
    "repository": os.environ.get("REPOSITORY", ""),
    "branch": os.environ.get("BRANCH", ""),
    "commit": os.environ.get("COMMIT", ""),
    "message": os.environ.get("COMMIT_MSG", ""),
    "author_name": os.environ.get("AUTHOR_NAME", ""),
    "author_email": os.environ.get("AUTHOR_EMAIL", ""),
    "env": "production",
    "status": "success",
}

print(json.dumps(payload))
PY
)"

          curl -fsS -X POST https://devex.pe/free/deployments \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: Notify deployment failure
        if: failure()
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR_NAME: ${{ github.event.head_commit.author.name }}
          AUTHOR_EMAIL: ${{ github.event.head_commit.author.email }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PAYLOAD="$(python3 - <<'PY'
import json
import os

payload = {
    "service": "Kamary",
    "repository": os.environ.get("REPOSITORY", ""),
    "branch": os.environ.get("BRANCH", ""),
    "commit": os.environ.get("COMMIT", ""),
    "message": os.environ.get("COMMIT_MSG", ""),
    "author_name": os.environ.get("AUTHOR_NAME", ""),
    "author_email": os.environ.get("AUTHOR_EMAIL", ""),
    "env": "production",
    "status": "failed",
    "error": f"Deploy failed. Review run: {os.environ.get('RUN_URL', '')}",
}

print(json.dumps(payload))
PY
)"

          curl -fsS -X POST https://devex.pe/free/deployments \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
